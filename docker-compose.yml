services:
  postgres:
    image: postgres:17
    container_name: central-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: central_termoeletrica
      POSTGRES_USER: central_app
      POSTGRES_PASSWORD: alterar_esta_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: